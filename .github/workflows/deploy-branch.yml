name: Build naar deploy-branch

# Bij elke push naar main: site bouwen en de inhoud van out/ (incl. .htaccess)
# als root van de branch `deploy` zetten. Cloudways ("Deployment via GIT") pullt die branch in public_html/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-branch
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Controle
        run: test -f out/index.html && test -f out/.htaccess
      - name: Push out/ naar branch deploy
        run: |
          cd out
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Build van ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" deploy
